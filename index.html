<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステッパー・クエスト２！</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); 
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        h1 { color: #ff4a5a; font-size: 1.8rem; text-shadow: 1px 1px 2px #fff; margin-bottom: 5px; }
        .sub-title { font-size: 1rem; color: #666; margin-bottom: 15px; }
        
        /* アカウント管理エリア */
        .account-card {
            background: #fff;
            border: 2px solid #ff80ab;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .account-card select, .account-card input {
            padding: 8px;
            font-size: 0.95rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin: 3px;
        }
        .input-name { width: 110px; }
        .input-age { width: 60px; }
        
        .btn-sm {
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            background: #ff4081;
            color: white;
            border: none;
            cursor: pointer;
        }
        .status-badge {
            display: inline-block;
            background: #ffe0b2;
            color: #e65100;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 15px;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* メインのカウント表示 */
        .gauge-area { margin: 15px 0; }
        #count-box { font-size: 6rem; font-weight: bold; color: #ff4a5a; line-height: 1; }
        .target-label { font-size: 1.2rem; color: #555; font-weight: bold; }

        /* メッセージエリア */
        #cheer-msg { font-size: 1.4rem; color: #ff9800; font-weight: bold; min-height: 45px; margin: 15px 0; }
        #warn-msg { font-size: 1.2rem; color: #e53935; font-weight: bold; min-height: 35px; background: #ffebee; border-radius: 10px; padding: 5px; visibility: hidden; }

        /* スタートボタン */
        .btn { 
            padding: 15px 30px; font-size: 1.3rem; font-weight: bold; border-radius: 50px; 
            background: linear-gradient(to bottom, #4caf50, #388e3c); color: white; 
            border: none; cursor: pointer; box-shadow: 0 5px 0 #2e7d32; text-shadow: 1px 1px 0 #2e7d32;
            transition: all 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e7d32; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* クリア画面 */
        .clear-screen { display: none; background: #fffde7; padding: 30px; border-radius: 25px; border: 5px solid #fdd835; }
        .pw-box { font-size: 2.2rem; font-weight: bold; color: #d32f2f; background: #fff; border: 3px dashed #ffb300; padding: 10px; margin: 20px 0; border-radius: 10px; word-break: break-all; }
        .notice-msg {
            background: #e1f5fe;
            color: #0277bd;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container" id="game-main">
    <h1>🎮 すいっちの じかんを かちとれ！</h1>
    <div class="sub-title">★ ステッパー・クエスト ★</div>

    <!-- アカウント切り替え・新規作成エリア -->
    <div class="account-card">
        <div style="margin-bottom: 8px;">
            <label for="userSelect">👤 プレイヤー: </label>
            <select id="userSelect" onchange="switchUser()"></select>
        </div>
        <div>
            <input type="text" id="newUserName" class="input-name" placeholder="なまえ" maxlength="10">
            <input type="number" id="newUserAge" class="input-age" placeholder="ねんれい" min="1" max="99"> さい
            <button class="btn-sm" onclick="createUser()">つくろう！</button>
        </div>
        <div class="status-badge" id="level-badge">レベル: 1 (10さい)</div>
    </div>
    
    <button class="btn" id="start-btn" onclick="startApp()">ぼうけんを はじめる！</button>
    
    <div class="gauge-area">
        <div id="count-box">0</div>
        <div class="target-label">ごーる まで あと <span id="left-count">--</span> かい！</div>
    </div>

    <!-- 応援・注意メッセージ -->
    <div id="cheer-msg">ボタンをおして スタートしてね！</div>
    <div id="warn-msg">⚠️ はやいよ！ゆっくり ふもう！</div>
</div>

<!-- クリア時に表示される画面 -->
<div class="container clear-screen" id="game-clear">
    <h1>🎉 クエストクリア！ 🎉</h1>
    <p style="font-size: 1.2rem; font-weight: bold;">すごーい！よく がんばったね！ 🌟</p>
    
    <!-- 2回目クリア時の注意メッセージ表示領域 -->
    <div id="same-day-notice" class="notice-msg" style="display: none;">
        きょうは もう クリアしたよ！<br>レベルアップは あしただよ！ 今日はおなじ かいすうだよ！
    </div>

    <p><span id="cleared-msg-detail"></span></p>
    <p>おうちの ひとに この『ぱすわーど』を つたえてね！</p>
    
    <div class="pw-box" id="password-display">LV1-0000</div>
    
    <p style="color: #666;">（おうちの人へ：確認したらSwitchの時間を増やしてあげてね）</p>
    <button class="btn" onclick="resetToNextLevel()">もういちど あそぶ！</button>
</div>

<script>
    // ==========================================
    // ⚙️ 設定
    // ==========================================
    const STORAGE_KEY = 'stepper_quest_users';

    // アカウントデータ保持変数
    let users = {};
    let currentUser = "勇者";

    // ゲーム状態変数
    let targetCount = 300;
    let stepCount = 0;
    let lastStepTime = 0;
    let currentDirection = "center"; 
    const ANGLE_THRESHOLD = 15; // 傾きの判定角度（度）

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
        loadUsers();
        updateUserUI();
    });

    // 本日の日付文字列取得 (YYYY-MM-DD)
    function getTodayString() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // 年齢とレベルから目標ステップ数を計算
    function calculateTargetCount(age, level) {
        if (age >= 10) {
            // 10歳以上：レベル1は800回、以降+50回ずつ
            return 800 + (level - 1) * 50;
        } else {
            // 9歳以下：レベル1は300回、以降+20回ずつ
            return 300 + (level - 1) * 20;
        }
    }

    // ------------------------------------------
    // アカウント管理機能
    // ------------------------------------------
    function loadUsers() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                users = JSON.parse(saved);
            } catch (e) {
                users = {};
            }
        }
        
        // 初期データが存在しない場合
        if (Object.keys(users).length === 0) {
            users["勇者"] = { level: 1, age: 7, lastClearedDate: "" };
            currentUser = "勇者";
            saveUsers();
        } else {
            currentUser = Object.keys(users)[0];
        }
    }

    function saveUsers() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
    }

    function createUser() {
        const nameInput = document.getElementById('newUserName');
        const ageInput = document.getElementById('newUserAge');
        
        const name = nameInput.value.trim();
        const age = parseInt(ageInput.value, 10);

        if (!name) {
            alert("なまえを 入力してね！");
            return;
        }
        if (isNaN(age) || age <= 0) {
            alert("ねんれいを 正しく入力してね！");
            return;
        }
        if (users[name]) {
            alert("その なまえは もう あるよ！");
            return;
        }

        users[name] = { 
            level: 1, 
            age: age,
            lastClearedDate: "" 
        };
        currentUser = name;
        saveUsers();
        
        nameInput.value = '';
        ageInput.value = '';
        updateUserUI();
    }

    function switchUser() {
        const select = document.getElementById('userSelect');
        currentUser = select.value;
        updateUserUI();
    }

    function updateUserUI() {
        const select = document.getElementById('userSelect');
        select.innerHTML = '';
        
        Object.keys(users).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            if (name === currentUser) opt.selected = true;
            select.appendChild(opt);
        });

        const userData = users[currentUser] || { level: 1, age: 7 };
        document.getElementById('level-badge').textContent = `レベル: ${userData.level} (${userData.age}さい)`;

        // 目標回数の再計算
        targetCount = calculateTargetCount(userData.age, userData.level);
        resetGameStats();
    }

    function resetGameStats() {
        stepCount = 0;
        document.getElementById('count-box').textContent = 0;
        document.getElementById('left-count').textContent = targetCount;
        document.getElementById('cheer-msg').textContent = "ボタンをおして スタートしてね！";
    }

    // ------------------------------------------
    // センサー・ゲームロジック
    // ------------------------------------------
    async function startApp() {
        if (typeof DeviceOrientationEvent !== 'undefined') {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        initSensor();
                    } else {
                        alert("センサーのきょかが ないと うごかないよ！");
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                if (navigator.permissions && navigator.permissions.query) {
                    try {
                        const result = await navigator.permissions.query({ name: 'accelerometer' });
                        if (result.state === 'granted' || result.state === 'prompt') {
                            initSensor();
                        } else {
                            alert("ブラウザの設定でセンサーを許可してください");
                        }
                    } catch (e) {
                        initSensor();
                    }
                } else {
                    initSensor();
                }
            }
        } else {
            alert("このスマホはセンサーに対応していない可能性があります");
        }
    }

    function initSensor() {
        window.addEventListener('deviceorientation', handleOrientation, true);
        document.getElementById('cheer-msg').textContent = "レッツ・ステップ！ふみだそう！";
        
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = true;
        startBtn.textContent = "そくていちゅう…";

        // アカウント設定の変更を不可にする
        document.getElementById('userSelect').disabled = true;
        document.getElementById('newUserName').disabled = true;
        document.getElementById('newUserAge').disabled = true;
    }

    function handleOrientation(event) {
        let gamma = event.gamma; 
        if (gamma === null || gamma === undefined) return;

        let now = Date.now();

        if (gamma > ANGLE_THRESHOLD && currentDirection !== "right") {
            processStep(now);
            currentDirection = "right";
        } else if (gamma < -ANGLE_THRESHOLD && currentDirection !== "left") {
            processStep(now);
            currentDirection = "left";
        } else if (Math.abs(gamma) < 5) {
            currentDirection = "center"; 
        }
    }

    function processStep(now) {
        if (lastStepTime !== 0 && (now - lastStepTime) < 500) {
            showWarning();
            lastStepTime = now; 
            return;
        }

        hideWarning();
        stepCount++;
        lastStepTime = now;

        document.getElementById('count-box').textContent = stepCount;
        let left = targetCount - stepCount;
        document.getElementById('left-count').textContent = left >= 0 ? left : 0;

        updateCheerMessage();

        if (stepCount >= targetCount) {
            gameClear();
        }
    }

    function updateCheerMessage() {
        let progress = stepCount / targetCount;

        if (progress >= 0.75) {
            document.getElementById('cheer-msg').innerHTML = "🔥 あとちょっと！ラストスパートだ！ 🔥";
        } else if (progress >= 0.5) {
            document.getElementById('cheer-msg').innerHTML = "✨ はんぶん きたよ！そのいきだ！ ✨";
        } else if (progress >= 0.25) {
            document.getElementById('cheer-msg').innerHTML = "👍 いいね！リズムに のってきた！ 👍";
        }
    }

    function showWarning() {
        document.getElementById('warn-msg').style.visibility = "visible";
    }

    function hideWarning() {
        document.getElementById('warn-msg').style.visibility = "hidden";
    }

    // ------------------------------------------
    // クリア処理
    // ------------------------------------------
    function gameClear() {
        window.removeEventListener('deviceorientation', handleOrientation);
        
        const userData = users[currentUser];
        const today = getTodayString();
        const sameDayNotice = document.getElementById('same-day-notice');
        const clearedMsgDetail = document.getElementById('cleared-msg-detail');
        
        document.getElementById('game-main').style.display = "none";
        document.getElementById('game-clear').style.display = "block";

        // 【同日2回目判定】
        if (userData.lastClearedDate === today) {
            // 今日すで cleared 済みの場合：レベルアップしない
            sameDayNotice.style.display = "block";
            clearedMsgDetail.textContent = `${currentUser} さんの レベルは そのままだよ！`;
        } else {
            // 今日初めてのクリアの場合：レベルアップ！
            sameDayNotice.style.display = "none";
            clearedMsgDetail.textContent = `${currentUser} さんの レベルが アップしたよ！`;
            userData.level += 1;
            userData.lastClearedDate = today;
            saveUsers();
        }

        // 【パスコード表示】 (現在のレベルを表示)
        let randomPin = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('password-display').textContent = "LV" + userData.level + "-" + randomPin;
    }

    function resetToNextLevel() {
        document.getElementById('game-clear').style.display = "none";
        document.getElementById('game-main').style.display = "block";

        // スタートボタンのリセット
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = false;
        startBtn.textContent = "ぼうけんを はじめる！";

        // アカウント設定のリセット
        document.getElementById('userSelect').disabled = false;
        document.getElementById('newUserName').disabled = false;
        document.getElementById('newUserAge').disabled = false;

        updateUserUI();
    }
</script>
</body>
</html>
